services:
  server-one:
      image: jwill9999/server-one
      environment:
        - NODE_ENV=local
      ports:
        - 3000:3000
  server-two:
    image: jwill9999/server-two
    environment:
      - NODE_ENV=local
    ports:
      - 3001:3001
  nginx-reverse-proxy:
    image: jwill9999/nginx-reverse-proxy
    ports:
      - 80:80
    depends_on:
      - server-one
      - server-two
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
